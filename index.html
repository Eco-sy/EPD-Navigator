<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EPD Navigator</title>
  <style>
        :root {
            color-scheme: light;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f4f7fb;
            color: #17212b;
            line-height: 1.6;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: radial-gradient(circle at top left, rgba(59, 130, 246, 0.16), transparent 35%),
                        radial-gradient(circle at bottom right, rgba(16, 185, 129, 0.14), transparent 30%),
                        #eef4fb;
        }

        .page-shell {
            width: min(100%, 860px);
        }

        header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            margin-bottom: 20px;
        }

        .brand {
            display: grid;
            gap: 12px;
        }

        .brand h1 {
            margin: 0;
            font-size: clamp(2rem, 2.5vw, 2.5rem);
            letter-spacing: -0.03em;
        }

        .brand p {
            margin: 0;
            max-width: 620px;
            color: #475569;
        }

        .card {
            background: #ffffff;
            border: 1px solid rgba(148, 163, 184, 0.18);
            border-radius: 28px;
            box-shadow: 0 28px 70px rgba(15, 23, 42, 0.08);
            padding: 32px;
        }

        #question-container > div {
            display: grid;
            gap: 18px;
        }

        #question-container p {
            margin: 0;
            font-size: 1.05rem;
            font-weight: 600;
            color: #0f172a;
        }

        #question-container pre {
            margin: 0;
            padding: 18px;
            border-radius: 16px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            overflow-x: auto;
            color: #334155;
        }

        .summary-page {
            display: grid;
            gap: 20px;
        }

        .summary-header p {
            margin: 0;
        }

        .summary-header p:first-child {
            font-size: 1.2rem;
            font-weight: 700;
            color: #0f172a;
        }

        .summary-header p:last-child {
            color: #475569;
        }

        .summary-list {
            display: grid;
            gap: 14px;
        }

        .summary-item {
            padding: 18px;
            border-radius: 20px;
            background: #f8fafc;
            border: 1px solid rgba(148, 163, 184, 0.24);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6);
        }

        .summary-question {
            margin: 0 0 8px 0;
            font-weight: 700;
            color: #0f172a;
        }

        .summary-answer {
            background: #ffffff;
            border-radius: 14px;
            border: 1px solid #e2e8f0;
            padding: 14px 16px;
            color: #334155;
            min-height: 36px;
            display: flex;
            align-items: center;
            white-space: pre-wrap;
            word-break: break-word;
        }

        button,
        input[type="text"],
        input[type="number"] {
            font: inherit;
        }

        button {
            border: none;
            border-radius: 14px;
            padding: 14px 18px;
            cursor: pointer;
            transition: transform 0.17s ease, box-shadow 0.17s ease, background-color 0.17s ease;
        }

        button:hover:not(:disabled) {
            transform: translateY(-1px);
            box-shadow: 0 18px 30px rgba(59, 130, 246, 0.16);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.55;
            transform: none;
            box-shadow: none;
        }

        .answer-button {
            background: #2563eb;
            color: #ffffff;
            min-width: 140px;
            margin: 4px 0;
            text-align: left;
        }

        .answer-button.secondary {
            background: #e2e8f0;
            color: #0f172a;
        }

        .input-row {
            display: grid;
            gap: 12px;
            width: 100%;
            max-width: 420px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            border: 1px solid #cbd5e1;
            padding: 14px 16px;
            border-radius: 14px;
            background: #f8fafc;
            color: #0f172a;
        }

        input[type="text"]:focus,
        input[type="number"]:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.14);
        }

        .controls {
            margin-top: 20px;
            display: flex;
            justify-content: flex-end;
        }

        #submit-button {
            background: #10b981;
            color: white;
            min-width: 160px;
        }

        @media (max-width: 640px) {
            .card {
                padding: 24px;
            }

            .controls {
                justify-content: center;
            }

            #submit-button {
                width: 100%;
            }
        }
  </style>
</head>
<body>
  <div class="page-shell">
    <header>
        <div class="brand">
            <h1>EPD Navigator</h1>
            <p>Beantworte den Fragebogen Schritt für Schritt. Wähle aus klaren Optionen oder gib Werte ein, um zur nächsten Frage zu gelangen.</p>
        </div>
    </header>
    <main class="card">
      <div id="question-container"></div>
      <div class="controls">
          <button id="submit-button" onclick="submitAnswers()" disabled>Antworten absenden</button>
      </div>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
