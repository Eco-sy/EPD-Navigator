<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fragebogen Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #f0f4f8;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    #app {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.10);
      padding: 2.5rem;
      max-width: 520px;
      width: 100%;
    }

    h1 { font-size: 1.2rem; color: #444; margin-bottom: 1.8rem; font-weight: 600; }

    /* ── Fragen-Wrapper ── */
    .question-wrapper {
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .28s ease, transform .28s ease;
    }
    .question-wrapper.visible {
      opacity: 1;
      transform: translateY(0);
    }

    .question-text {
      font-size: 1.05rem;
      color: #222;
      line-height: 1.55;
      margin-bottom: 1.4rem;
    }

    /* ── Options-Buttons ── */
    .question-options {
      display: flex;
      flex-wrap: wrap;
      gap: .6rem;
    }

    .option-btn {
      padding: .55rem 1.2rem;
      border: 2px solid #d0d7e2;
      border-radius: 8px;
      background: #fff;
      color: #333;
      font-size: .95rem;
      cursor: pointer;
      transition: border-color .15s, background .15s, color .15s;
    }
    .option-btn:hover  { border-color: #5b8dee; background: #eef3fd; }
    .option-btn.selected { border-color: #3a6fd8; background: #3a6fd8; color: #fff; }

    /* ── Eingabefelder ── */
    .question-input-wrapper {
      display: flex;
      gap: .6rem;
      align-items: center;
    }

    .question-input {
      flex: 1;
      padding: .55rem .9rem;
      border: 2px solid #d0d7e2;
      border-radius: 8px;
      font-size: .95rem;
      outline: none;
      transition: border-color .15s;
    }
    .question-input:focus { border-color: #5b8dee; }
    .question-input.input-error { border-color: #e05c5c; }

    .confirm-btn {
      padding: .55rem 1.1rem;
      border: none;
      border-radius: 8px;
      background: #3a6fd8;
      color: #fff;
      font-size: .95rem;
      cursor: pointer;
      transition: background .15s;
    }
    .confirm-btn:hover { background: #2d58b0; }

    /* ── Ende ── */
    .end-screen h2 { font-size: 1.1rem; color: #2a8a4a; margin-bottom: 1rem; }

    .answers-summary {
      background: #f6f8fb;
      border: 1px solid #dde3ee;
      border-radius: 8px;
      padding: 1rem;
      font-size: .82rem;
      color: #444;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .question-error { color: #e05c5c; font-size: .9rem; }

    #restart-btn {
      margin-top: 1.4rem;
      padding: .5rem 1.2rem;
      border: 2px solid #3a6fd8;
      border-radius: 8px;
      background: transparent;
      color: #3a6fd8;
      font-size: .9rem;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    #restart-btn:hover { background: #3a6fd8; color: #fff; }
  </style>
</head>
<body>

<div id="app">
  <h1>EPD-Kostenkalkulator</h1>
  <div id="question-container"></div>
  <button id="restart-btn" style="display:none">↺ Neu starten</button>
</div>

<!-- ── Fragen-JSON ──────────────────────────────────────────────────────── -->
<script>
  fetch("questions.json")
    .then(res => {
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    })
    .then(data => {
      const engine = new QuestionEngine(
        data,
        (id, question) => renderer.render(id, question),
        (answers) => {
          renderer.renderEnd(answers);
          restartBtn.style.display = "inline-block";
        }
      );
      // handleAnswer braucht jetzt Zugriff auf engine → nach innen verschieben
      function handleAnswer(qID, answer, nextID) {
        engine.answer(qID, answer, nextID);
      }
      engine.start();
    })
    .catch(err => {
      container.textContent = "Fehler beim Laden der Fragen: " + err.message;
    });
</script>
<!-- ── Module ──────────────────────────────────────────────────────────── -->
<script src="questionEngine.js"></script>
<script src="questionRenderer.js"></script>

<!-- ── Initialisierung ─────────────────────────────────────────────────── -->
<script>
  const container  = document.getElementById("question-container");
  const restartBtn = document.getElementById("restart-btn");

  // Renderer erstellen
  const renderer = new QuestionRenderer(container, handleAnswer);

  // Engine erstellen
  const engine = new QuestionEngine(
    QUESTIONS_JSON,
    (id, question) => renderer.render(id, question),   // onQuestion → Renderer
    (answers)       => {                                // onEnd
      renderer.renderEnd(answers);
      restartBtn.style.display = "inline-block";
    }
  );

  // Antwort vom Renderer zurück an den Engine
  function handleAnswer(questionID, answer, nextQuestionID) {
    engine.answer(questionID, answer, nextQuestionID);
  }

  // Starten
  engine.start();

  // Neustart-Button
  restartBtn.addEventListener("click", () => {
    restartBtn.style.display = "none";
    engine.reset();
    engine.start();
  });
</script>
</body>
</html>
