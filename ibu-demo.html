<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>IBU EPD Gebührenrechner – Demo</title>
  <style>
    body { font-family: monospace; background: #0f1117; color: #c9d1d9; margin: 0; padding: 2rem; }
    h1 { font-size: 1rem; color: #58a6ff; margin-bottom: 0.25rem; }
    p.sub { font-size: 0.8rem; color: #6e7681; margin: 0 0 2rem; }
    .scenario { border: 1px solid #30363d; border-radius: 6px; margin-bottom: 1.5rem; overflow: hidden; }
    .scenario-header { background: #161b22; padding: 0.6rem 1rem; font-size: 0.8rem; color: #58a6ff; border-bottom: 1px solid #30363d; }
    .block { padding: 0.75rem 1rem; border-bottom: 1px solid #21262d; }
    .block:last-child { border-bottom: none; }
    .block-title { font-size: 0.7rem; color: #6e7681; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem; }
    .row { display: flex; justify-content: space-between; font-size: 0.82rem; padding: 2px 0; }
    .row .label { color: #8b949e; }
    .row .val { color: #c9d1d9; }
    .row.total .label, .row.total .val { color: #e6edf3; font-weight: bold; border-top: 1px solid #30363d; padding-top: 4px; margin-top: 2px; }
    .row.grand .label, .row.grand .val { color: #3fb950; font-size: 0.95rem; }
    .row.grandvat .label, .row.grandvat .val { color: #58a6ff; font-size: 0.82rem; }
    .indent { padding-left: 1rem; }
    .tag { font-size: 0.7rem; background: #1f3a5f; color: #58a6ff; padding: 1px 6px; border-radius: 3px; margin-left: 6px; }
  </style>
</head>
<body>

<h1>IBU EPD Gebührenrechner – Demo</h1>
<p class="sub">Kein Verbandsmitglied · Gebührenordnung gültig ab 01.09.2025 · alle Beträge netto zzgl. 19% MwSt.</p>

<div id="output"></div>

<script>
// ============================================================
// ibu-calculator.js (inline, kein Import nötig)
// ============================================================

const MEMBERSHIP_FEES = { 1:600, 2:900, 3:1200, 4:1950, 5:3300, 6:4450, 7:5400 };

const SIGN_FEE_TIERS = [
  { from:1, to:1,    fee:2880 },
  { from:2, to:2,    fee:1440 },
  { from:3, to:3,    fee:720  },
  { from:4, to:4,    fee:540  },
  { from:5, to:null, fee:360  },
];

const ONE_TIME_FEES = { newEPD:2700, familyEPD:500, reworkEPD:1500, renewalEPD:1500 };

function getSignFee(pos) {
  for (const tier of SIGN_FEE_TIERS) {
    if (pos >= tier.from && (tier.to === null || pos <= tier.to)) return tier.fee;
  }
  return SIGN_FEE_TIERS[SIGN_FEE_TIERS.length - 1].fee;
}

function calcSignFees(totalValidEPDs) {
  const breakdown = [];
  let total = 0;
  for (let i = 1; i <= totalValidEPDs; i++) {
    const fee = getSignFee(i);
    breakdown.push({ position: i, fee });
    total += fee;
  }
  return { breakdown, total };
}

function calculateIBU(customerData, answers) {
  const membershipGroup = customerData.membershipGroup;
  if (!MEMBERSHIP_FEES[membershipGroup])
    throw new Error(`Ungültige Mitgliedschaftsgruppe: ${membershipGroup}. Erlaubt: 1–7.`);

  const existingEPDs      = Math.max(0, customerData.existingValidEPDs ?? 0);
  const renewEPDs         = Math.max(0, answers.renewEPDs         ?? 0);
  const newEPDs           = Math.max(0, answers.newEPDs           ?? 0);
  const newEPDsFromFamily = Math.max(0, Math.min(answers.newEPDsFromFamily ?? 0, Math.max(0, newEPDs - 1)));
  const reworkEPDs        = Math.max(0, answers.reworkEPDs        ?? 0);
  const normalNewEPDs     = newEPDs - newEPDsFromFamily;

  const verificationCosts = {
    newEPDs:    { count: normalNewEPDs,     unitCost: ONE_TIME_FEES.newEPD,    total: normalNewEPDs     * ONE_TIME_FEES.newEPD,    label: 'Erstausstellung neue EPDs' },
    familyEPDs: { count: newEPDsFromFamily, unitCost: ONE_TIME_FEES.familyEPD, total: newEPDsFromFamily * ONE_TIME_FEES.familyEPD, label: 'Weitere EPDs gleiche Produktfamilie' },
    reworkEPDs: { count: reworkEPDs,        unitCost: ONE_TIME_FEES.reworkEPD, total: reworkEPDs        * ONE_TIME_FEES.reworkEPD, label: 'Überarbeitung / Aktualisierung' },
    renewEPDs:  { count: renewEPDs,         unitCost: ONE_TIME_FEES.renewalEPD,total: renewEPDs         * ONE_TIME_FEES.renewalEPD,label: 'Verlängerung bestehender EPDs' },
  };

  const totalOneTimeCosts = Object.values(verificationCosts).reduce((s, c) => s + c.total, 0);
  const totalValidEPDs    = existingEPDs + newEPDs + reworkEPDs;
  const membershipFee     = MEMBERSHIP_FEES[membershipGroup];
  const signFees          = calcSignFees(totalValidEPDs);
  const totalAnnualCosts  = membershipFee + signFees.total;

  return {
    provider: 'IBU', memberType: 'non-associate',
    companyName: customerData.companyName,
    calculatedAt: new Date().toISOString(),
    inputs: { membershipGroup, existingEPDs, renewEPDs, newEPDs, newEPDsFromFamily, reworkEPDs, totalValidEPDsAfter: totalValidEPDs },
    oneTime: { items: verificationCosts, total: totalOneTimeCosts },
    annual: { items: { membershipFee: { total: membershipFee, label: `Mitgliedsbeitrag IBU (Gruppe F${membershipGroup})` }, signFees: { total: signFees.total, breakdown: signFees.breakdown, label: 'Zeichenentgelte (jährlich, 3-facher Satz)' } }, total: totalAnnualCosts },
    totalFirstYear: totalOneTimeCosts + totalAnnualCosts,
  };
}

// ============================================================
// Demo-Szenarien
// ============================================================

const scenarios = [
  {
    title: 'Szenario 1 – Neukunde, 1 neue EPD',
    customer: { companyName: 'Musterbau GmbH', membershipGroup: 3, existingValidEPDs: 0 },
    answers:  { renewEPDs: 0, newEPDs: 1, newEPDsFromFamily: 0, reworkEPDs: 0 },
  },
  {
    title: 'Szenario 2 – Bestandskunde, 2 bestehende EPDs, 1 verlängern + 1 neue',
    customer: { companyName: 'Dämmstoffe AG', membershipGroup: 4, existingValidEPDs: 2 },
    answers:  { renewEPDs: 1, newEPDs: 1, newEPDsFromFamily: 0, reworkEPDs: 0 },
  },
  {
    title: 'Szenario 3 – Großkunde, Produktfamilie (4 neue, 3 davon gleiche Familie)',
    customer: { companyName: 'Bauelemente Gruppe AG', membershipGroup: 6, existingValidEPDs: 5 },
    answers:  { renewEPDs: 2, newEPDs: 4, newEPDsFromFamily: 3, reworkEPDs: 1 },
  },
];

// ============================================================
// HTML rendern
// ============================================================

const fmt = n => new Intl.NumberFormat('de-DE', { style:'currency', currency:'EUR', maximumFractionDigits:0 }).format(n);

function renderResult(r) {
  const i = r.inputs;
  let html = `<div class="scenario">`;
  html += `<div class="scenario-header">${r.companyName} <span class="tag">F${i.membershipGroup}</span><span class="tag">${i.totalValidEPDsAfter} EPDs danach</span></div>`;

  // Eingaben
  html += `<div class="block"><div class="block-title">Eingaben (aus CRM + Fragebogen)</div>`;
  html += row('Bestehende gültige EPDs', i.existingEPDs);
  html += row('Verlängerungen',          i.renewEPDs);
  html += row('Neue EPDs',               i.newEPDs + (i.newEPDsFromFamily ? ` (davon ${i.newEPDsFromFamily}× Produktfamilie)` : ''));
  html += row('Überarbeitungen',         i.reworkEPDs);
  html += `</div>`;

  // Einmalige Kosten
  html += `<div class="block"><div class="block-title">Einmalige Kosten (Verifizierung)</div>`;
  for (const item of Object.values(r.oneTime.items)) {
    if (item.count > 0) {
      html += row(item.label, fmt(item.total));
      html += `<div class="row indent"><span class="label">${item.count} × ${fmt(item.unitCost)}</span></div>`;
    }
  }
  html += rowTotal('Summe einmalig', fmt(r.oneTime.total));
  html += `</div>`;

  // Jährliche Kosten
  html += `<div class="block"><div class="block-title">Jährliche Kosten</div>`;
  html += row(r.annual.items.membershipFee.label, fmt(r.annual.items.membershipFee.total));
  html += row(r.annual.items.signFees.label, fmt(r.annual.items.signFees.total));
  for (const { position, fee } of r.annual.items.signFees.breakdown) {
    html += `<div class="row indent"><span class="label">EPD ${position}</span><span class="val">${fmt(fee)}/Jahr</span></div>`;
  }
  html += rowTotal('Summe jährlich', fmt(r.annual.total));
  html += `</div>`;

  // Gesamt
  html += `<div class="block">`;
  html += `<div class="row grand"><span class="label">Gesamt Jahr 1 (netto)</span><span class="val">${fmt(r.totalFirstYear)}</span></div>`;
  html += `<div class="row grandvat"><span class="label">inkl. 19% MwSt.</span><span class="val">${fmt(r.totalFirstYear * 1.19)}</span></div>`;
  html += `</div>`;

  html += `</div>`;
  return html;
}

function row(label, val) {
  return `<div class="row"><span class="label">${label}</span><span class="val">${val}</span></div>`;
}
function rowTotal(label, val) {
  return `<div class="row total"><span class="label">${label}</span><span class="val">${val}</span></div>`;
}

const output = document.getElementById('output');
for (const s of scenarios) {
  const result = calculateIBU(s.customer, s.answers);
  const wrapper = document.createElement('div');
  const header = document.createElement('p');
  header.style.cssText = 'font-size:0.75rem; color:#6e7681; margin: 1.5rem 0 0.4rem;';
  header.textContent = s.title;
  output.appendChild(header);
  wrapper.innerHTML = renderResult(result);
  output.appendChild(wrapper);
}
</script>
</body>
</html>
